<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="64" height="64" viewBox="0 0 64 64">
  <title>Parking véhicule électrique</title>

  <!-- Fond -->
  <rect x="2" y="2" width="60" height="60" rx="10"
        fill="#1976D2" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Lettre P -->
  <path d="M13 48V16h13c8 0 13 4.5 13 11.5S34 39 26 39h-6v9h-7zm7-16h6
           c4 0 6-1.6 6-4.5S30 23 26 23h-6v9z"
        fill="#FFFFFF"/>

  <!-- Borne / prise électrique -->
  <rect x="42" y="18" width="10" height="22" rx="2"
        fill="#FFFFFF"/>
  <rect x="44" y="14" width="2.5" height="7" rx="1"
        fill="#FFFFFF"/>
  <rect x="48.5" y="14" width="2.5" height="7" rx="1"
        fill="#FFFFFF"/>

  <!-- Câble -->
  <path d="M47 40v5c0 4 2 6 6 6h2"
        fill="none" stroke="#FFFFFF" stroke-width="3"
        stroke-linecap="round"/>

  <!-- Éclair -->
  <path d="M48 22l-4 8h4l-2 7 7-10h-4l2-5z"
        fill="#1976D2"/>
</svg>
